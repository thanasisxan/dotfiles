[general]
# JetBrains dark colors, from jb.nvim extras (matches nvim)
import = ["~/.config/alacritty/jb-dark.toml"]

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "zsh"
args = ["-l", "-i", "-c", "tmux new-session -A -s main"]

[window]
padding.x = 10
padding.y = 10
decorations = "full"
option_as_alt = "Both"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 13.0
