# --- PREFIX ---
set -g prefix C-a
unbind C-b
bind C-a last-window
bind a send-prefix

# --- VI MODE & COPY ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# --- SHELL ---
set -g default-command "${SHELL}"

# --- GENERAL ---
set -g mouse on
set -sg escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g set-clipboard on

# --- EXTENDED KEYS (Shift+Enter etc. reach apps like Claude Code) ---
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Let notifications/progress escape sequences reach the outer terminal
set -g allow-passthrough on

# --- WINDOWS ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Killing the current session moves you to another one instead of detaching
# (detaching closes Alacritty, since it only runs tmux)
set -g detach-on-destroy off

# Sessions made without a name (bare "tmux new") are named after their folder
set-hook -g session-created {
  if -F '#{m/r:^[0-9]+$,#{session_name}}' {
    rename-session -- '#{?#{m/r:^/(Users|home)/[^/]+$,#{session_path}},home,#{s/[.]/_/:#{b:session_path}}}'
  }
}

# Pane header shows the task Claude Code is working on (its terminal title).
# Off by default; claude-state.sh turns it on only in windows running Claude,
# since tmux reserves the header row for every pane once it is on.
set -g pane-border-status off
set -g pane-border-format '#{?#{E:@is_claude},#{?pane_active,#[fg=#DFE1E5],#[fg=#6F737A]} #{pane_title} ,}'

# A pane runs Claude Code if the process is its native binary (named after its version,
# e.g. 2.1.310) or "claude", or if the pane title has Claude's "✳ " prefix.
set -g @is_claude '#{||:#{m/r:^([0-9]+[.][0-9]+[.][0-9]+|claude)$,#{pane_current_command}},#{m:✳ *,#{pane_title}}}'

# Claude state, set per pane by claude-state.sh from Claude Code hooks (see README):
# "●" while working, "!" when waiting on a permission prompt, nothing when idle.
set -g @claude_mark '#{?#{==:#{@claude_state},working},●,#{?#{==:#{@claude_state},input},!,}}'

# Window names: "program:folder", or just "folder" for a shell.
# Claude Code shows as "claude:folder", with its state mark after "claude".
set -g status-interval 5
set -g automatic-rename-format '#{?#{E:@is_claude},claude#{E:@claude_mark}:#{?#{m/r:^/(Users|home)/[^/]+$,#{pane_current_path}},~,#{b:pane_current_path}},#{?#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}},#{?#{m/r:^/(Users|home)/[^/]+$,#{pane_current_path}},~,#{b:pane_current_path}},#{pane_current_command}:#{?#{m/r:^/(Users|home)/[^/]+$,#{pane_current_path}},~,#{b:pane_current_path}}}}'

# --- BELLS (flag the window whose Claude Code finished or needs input) ---
setw -g monitor-bell on
set -g bell-action any

# --- LOOK (JetBrains dark, matches nvim jb theme) ---
set -g status-position top
set -g status-style "bg=#2B2D30,fg=#6F737A"
set -g status-left "#[bg=#3574F0,fg=#FFFFFF,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#6F737A]%H:%M "
setw -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#393B40,fg=#DFE1E5,bold] #I #W "
setw -g window-status-bell-style "fg=#1E1F22,bg=#E5BF00,bold"
set -g pane-border-style "fg=#393B40"
set -g pane-active-border-style "fg=#3574F0"
set -g message-style "bg=#2B2D30,fg=#BCBEC4"
setw -g mode-style "bg=#214283,fg=#BCBEC4"
set -g popup-border-style "fg=#43454A"
set -g popup-border-lines rounded
set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.config/fzf/jb-dark.fzfrc"

# --- PANE NAVIGATION ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- PANE RESIZING ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- SPLITS & SESSIONS ---
bind c new-window -c "#{pane_current_path}"

unbind v
bind v split-window -h -c "#{pane_current_path}"

unbind s
bind s split-window -v -c "#{pane_current_path}"

# Capital S for Session List
unbind S
bind S choose-tree -Zs

# Project picker: fzf over ~/repos, switch to or create its session
bind f display-popup -E -w 60% -h 60% "~/.config/tmux/sessionizer.sh"

